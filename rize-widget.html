<html lang="en">

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #111113;

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

function App() {
  const [view, setView] = useState('home');
  const [selectedTier, setSelectedTier] = useState(null);
  const [showDemoModal, setShowDemoModal] = useState(false);
  
  const startOnboarding = (tier) => {
    setSelectedTier(tier);
    setView('onboarding');
  };
  
  const backToPricing = () => {
    setView('pricing');
    setSelectedTier(null);
  };
  
  return (
    <div className="min-h-screen text-white antialiased" style={{ backgroundColor: '#111113' }}>
      {/* View Toggle */}
      <div className="sticky top-0 z-50 border-b p-3" style={{ backgroundColor: '#111113', borderColor: 'rgba(255,255,255,0.1)' }}>
        <div className="mx-auto max-w-5xl flex justify-center gap-2">
          {['home', 'pricing', 'onboarding'].map(v => (
            <button
              key={v}
              onClick={() => setView(v)}
              className="px-4 py-1.5 rounded-md text-sm transition-all capitalize"
              style={{ 
                backgroundColor: view === v ? '#e4e4e7' : 'transparent',
                color: view === v ? '#000' : '#a1a1aa',
                border: view === v ? 'none' : '1px solid rgba(255,255,255,0.1)'
              }}
            >
              {v === 'home' ? 'Homepage' : v}
            </button>
          ))}
          <button
            onClick={() => setShowDemoModal(true)}
            className="px-4 py-1.5 rounded-md text-sm"
            style={{ backgroundColor: 'transparent', color: '#a1a1aa', border: '1px solid rgba(255,255,255,0.1)' }}
          >
            Demo Modal
          </button>
        </div>
      </div>

      {view === 'home' && <HomePage onGetStarted={() => startOnboarding('professional')} onBookDemo={() => setShowDemoModal(true)} onViewPricing={() => setView('pricing')} />}
      {view === 'pricing' && <PricingPage onSelectTier={startOnboarding} onBookDemo={() => setShowDemoModal(true)} />}
      {view === 'onboarding' && <OnboardingFlow tier={selectedTier} onBack={backToPricing} />}
      {showDemoModal && <DemoModal onClose={() => setShowDemoModal(false)} />}
    </div>
  );
}

// ==========================================
// FEATURE COMPARISON COMPONENTS
// ==========================================
function FeatureSection({ title, children }) {
  return (
    <div className="mb-2">
      <div className="py-3 mt-4">
        <span className="text-sm font-semibold text-white">{title}</span>
      </div>
      {children}
    </div>
  );
}

function FeatureRow({ feature, free, standard, professional, team }) {
  const Check = () => (
    <svg className="w-5 h-5 mx-auto text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  );
  const Cross = () => <span className="text-xs mx-auto" style={{ color: '#3f3f46' }}>—</span>;
  
  return (
    <div className="grid grid-cols-5 gap-4 py-3" style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
      <div className="text-sm" style={{ color: '#a1a1aa' }}>{feature}</div>
      <div className="flex justify-center">{free ? <Check /> : <Cross />}</div>
      <div className="flex justify-center">{standard ? <Check /> : <Cross />}</div>
      <div className="flex justify-center">{professional ? <Check /> : <Cross />}</div>
      <div className="flex justify-center">{team ? <Check /> : <Cross />}</div>
    </div>
  );
}

              { q: 'Can I try before I buy?', a: 'Yes! Start with the Free tier to explore Rize. You can upgrade anytime for full features.' },
              { q: 'Can I change plans later?', a: 'Absolutely. Upgrade, downgrade, or cancel anytime from your account settings.' },

                <summary className="cursor-pointer text-sm font-medium text-white flex items-center justify-between">
                  {faq.q}
                  <span style={{ color: '#71717a' }} className="group-open:rotate-180 transition-transform">▼</span>
                </summary>

              </details>

        </div>
        
        <FinalCTA onGetStarted={() => onSelectTier('professional')} onBookDemo={onBookDemo} />

    </div>
  );
}

// ==========================================
// ONBOARDING FLOW
// ==========================================
function OnboardingFlow({ tier, onBack }) {
  const [step, setStep] = useState(0);
  const [formData, setFormData] = useState({
    email: '',
    name: '',
    role: '',
    teamSize: '',
    teamTools: [],
    teamEmails: [''],
    domainAutoJoin: false,
    goals: [],
    integrations: [],
    phone: ''
  });
  
  const isTeam = tier === 'team';
  const isManagerFlow = ['Manager', 'Executive'].includes(formData.role);
  const isLargeTeam = ['50+'].includes(formData.teamSize);
  const showTeamSizeForRole = ['Founder', 'Manager', 'Executive', 'Consultant'].includes(formData.role);
  
  const tierColors = { free: '#71717a', standard: '#a78bfa', professional: '#a78bfa', team: '#10B981' };
  const tierColor = tierColors[tier] || '#a78bfa';
  const tierNames = { free: 'Free', standard: 'Standard', professional: 'Professional', team: 'Team' };
  
  const getSteps = () => {
    const baseSteps = [
      { id: 'email', title: 'Get started', subtitle: 'Create your Rize account' },
      { id: 'name', title: "What's your name?", subtitle: "We'll personalize your experience" },
      { id: 'role', title: 'What best describes you?', subtitle: "This helps us tailor Rize" },
    ];
    
    if (isManagerFlow && isLargeTeam) {
      return [...baseSteps, 
        { id: 'teamSize', title: 'How many people?', subtitle: 'This helps us prepare' },
        { id: 'calendly', title: 'Schedule your call', subtitle: 'Meet with our team' }
      ];
    }
    
    if (isManagerFlow || isTeam) {
      const flowSteps = [...baseSteps,
        { id: 'teamSize', title: 'How many people?', subtitle: 'This helps us set up' },
        { id: 'teamTools', title: 'What tools does your team use?', subtitle: 'Select all that apply' },
        { id: 'invite', title: 'Invite your team', subtitle: 'Get started together' }
      ];
      
      if (formData.teamSize === '6-10' || formData.teamSize === '11-50') {
        flowSteps.push({ id: 'phone', title: "Enter your phone number if you'd like help with account setup:", subtitle: 'Optional' });
      }
      
      flowSteps.push({ id: 'integrations', title: 'Connect your tools', subtitle: 'Rize works with your apps' });
      flowSteps.push({ id: 'download', title: "You're all set!", subtitle: (formData.teamSize === '6-10' || formData.teamSize === '11-50') ? 'Download Rize or schedule a demo' : 'Download Rize' });
      return flowSteps;
    }
    
    if (showTeamSizeForRole) {
      return [...baseSteps,
        { id: 'teamSize', title: 'Team size?', subtitle: 'Helps us personalize' },
        { id: 'goals', title: 'Your goals?', subtitle: 'Select all that apply' },
        { id: 'integrations', title: 'Connect tools', subtitle: 'Your favorite apps' },
        { id: 'download', title: "You're all set!", subtitle: 'Download Rize' }
      ];
    }
    
    return [...baseSteps,
      { id: 'goals', title: 'Your goals?', subtitle: 'Select all that apply' },
      { id: 'integrations', title: 'Connect tools', subtitle: 'Your favorite apps' },
      { id: 'download', title: "You're all set!", subtitle: 'Download Rize' }
    ];
  };
  
  const steps = getSteps();
  const currentStep = steps[step];
  const progress = ((step + 1) / steps.length) * 100;
  
  const nextStep = () => { if (step < steps.length - 1) setStep(step + 1); };
  const prevStep = () => { if (step > 0) setStep(step - 1); else onBack(); };
  const updateFormData = (key, value) => setFormData(prev => ({ ...prev, [key]: value }));
  const toggleArrayItem = (key, item) => {
    setFormData(prev => ({
      ...prev,
      [key]: prev[key].includes(item) ? prev[key].filter(i => i !== item) : [...prev[key], item]
    }));
  };
  
  return (
    <div className="min-h-screen flex flex-col" style={{ backgroundColor: '#111113' }}>
      {/* Progress Bar */}
      <div className="h-1" style={{ backgroundColor: '#1a1a1f' }}>
        <div className="h-full transition-all duration-300" style={{ width: `${progress}%`, backgroundColor: tierColor }} />
      </div>
      
      {/* Header */}
      <div className="px-4 py-4 flex items-center justify-between">
        <span className="text-lg tracking-widest font-light text-white">RIZE</span>
        <span className="text-xs px-2 py-1 rounded" style={{ backgroundColor: `${tierColor}20`, color: tierColor }}>
          {tierNames[tier] || 'Professional'}
        </span>
      </div>
      
      {/* Content */}
      <div className="flex-1 flex items-center justify-center px-4 py-8">
        <div className="w-full max-w-md">
          <div className="text-center mb-8">
            {currentStep.subtitle && <p className="text-xs mb-2" style={{ color: '#71717a' }}>{currentStep.subtitle}</p>}
            <h2 className="text-2xl font-semibold text-white">{currentStep.title}</h2>
          </div>
          
          {/* Email Step */}
          {currentStep.id === 'email' && (
            <div className="space-y-4">
              <input
                type="email"
                placeholder="you@company.com"
                value={formData.email}
                onChange={(e) => updateFormData('email', e.target.value)}
                className="w-full px-4 py-3 rounded-md text-white text-sm outline-none"
                style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}
              />
              <button
                onClick={nextStep}
                disabled={!formData.email}
                className="w-full py-3 rounded-md text-sm font-medium disabled:opacity-50"
                style={{ backgroundColor: tierColor, color: '#fff' }}
              >
                Continue with Email
              </button>
              <div className="flex items-center gap-3">
                <div className="flex-1 h-px" style={{ backgroundColor: 'rgba(255,255,255,0.1)' }}></div>
                <span className="text-xs" style={{ color: '#71717a' }}>or</span>
                <div className="flex-1 h-px" style={{ backgroundColor: 'rgba(255,255,255,0.1)' }}></div>
              </div>
              <button className="w-full py-3 rounded-md text-sm font-medium" style={{ backgroundColor: '#e4e4e7', color: '#000' }}>
                Continue with Google
              </button>
            </div>
          )}
          
          {/* Name Step */}
          {currentStep.id === 'name' && (
            <input
              type="text"
              placeholder="Your name"
              value={formData.name}
              onChange={(e) => updateFormData('name', e.target.value)}
              className="w-full px-4 py-3 rounded-md text-white text-sm outline-none"
              style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}

          )}
          
          {/* Role Step */}
          {currentStep.id === 'role' && (
            <div className="grid grid-cols-2 gap-2">
              {['Freelancer', 'Employee', 'Manager', 'Executive', 'Founder', 'Consultant', 'Designer', 'Developer'].map(role => (
                <button
                  key={role}
                  onClick={() => updateFormData('role', role)}
                  className="px-4 py-3 rounded-md text-sm transition-all"
                  style={{
                    backgroundColor: formData.role === role ? `${tierColor}20` : '#141419',
                    border: formData.role === role ? `2px solid ${tierColor}` : '1px solid rgba(255,255,255,0.1)',
                    color: formData.role === role ? tierColor : '#e4e4e7'
                  }}
                >
                  {role}
                </button>
              ))}
            </div>
          )}
          
          {/* Team Size Step */}
          {currentStep.id === 'teamSize' && (
            <div className="grid grid-cols-2 gap-2">
              {(isManagerFlow || isTeam) ? (
                ['2-5', '6-10', '11-50', '50+'].map(size => (
                  <button
                    key={size}
                    onClick={() => updateFormData('teamSize', size)}
                    className="px-4 py-3 rounded-md text-sm"
                    style={{
                      backgroundColor: formData.teamSize === size ? `${tierColor}20` : '#141419',
                      border: formData.teamSize === size ? `2px solid ${tierColor}` : '1px solid rgba(255,255,255,0.1)',
                      color: formData.teamSize === size ? tierColor : '#e4e4e7'
                    }}
                  >
                    {size} people
                  </button>
                ))
              ) : (
                ['Just me', '2-5', '6-10', '11-25', '26-50', '50+'].map(size => (
                  <button
                    key={size}
                    onClick={() => updateFormData('teamSize', size)}
                    className="px-4 py-3 rounded-md text-sm"
                    style={{
                      backgroundColor: formData.teamSize === size ? `${tierColor}20` : '#141419',
                      border: formData.teamSize === size ? `2px solid ${tierColor}` : '1px solid rgba(255,255,255,0.1)',
                      color: formData.teamSize === size ? tierColor : '#e4e4e7'
                    }}
                  >
                    {size === 'Just me' ? size : `${size} people`}
                  </button>
                ))
              )}
            </div>
          )}
          
          {/* Team Tools Step */}
          {currentStep.id === 'teamTools' && (
            <div className="space-y-3">
              <p className="text-sm mb-4" style={{ color: '#71717a' }}>Select all that apply. We'll pre-configure your integrations.</p>
              {[
                { name: 'ClickUp', icon: '📋' },
                { name: 'Linear', icon: '⚡' },
                { name: 'Asana', icon: '🎯' },
                { name: 'Notion', icon: '📝' },
                { name: 'Jira', icon: '🔷' },
                { name: 'Monday.com', icon: '📊' },
                { name: 'Other', icon: '➕' }
              ].map(tool => (
                <button
                  key={tool.name}
                  onClick={() => toggleArrayItem('teamTools', tool.name)}
                  className="w-full px-4 py-4 rounded-md text-sm text-left flex items-center gap-4"
                  style={{
                    backgroundColor: formData.teamTools.includes(tool.name) ? 'rgba(168,85,247,0.15)' : '#141419',
                    border: formData.teamTools.includes(tool.name) ? '2px solid #a78bfa' : '1px solid rgba(255,255,255,0.1)'
                  }}
                >
                  <span className="text-xl">{tool.icon}</span>
                  <span className="flex-1 text-white">{tool.name}</span>
                  {formData.teamTools.includes(tool.name) && <span style={{ color: '#a78bfa' }}>✓</span>}
                </button>
              ))}
            </div>
          )}
          
          {/* Invite Step */}
          {currentStep.id === 'invite' && (
            <div className="space-y-6">
              <p className="text-sm text-center" style={{ color: '#71717a' }}>
                Invite your team to <span style={{ color: '#10B981' }}>get started 200% faster</span>
              </p>
              <input
                type="text"
                placeholder="Enter email addresses (or paste multiple)"
                value={formData.teamEmails[0]}
                onChange={(e) => updateFormData('teamEmails', [e.target.value])}
                className="w-full px-4 py-4 rounded-md text-white text-sm outline-none"
                style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.15)' }}
              />
              <div className="flex items-center justify-between p-4 rounded-md" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}>
                <div className="flex items-center gap-3">
                  <span style={{ color: '#a78bfa' }}>🔗</span>
                  <div>
                    <p className="text-sm text-white">Allow @{formData.email?.split('@')[1] || 'company.com'}</p>
                    <p className="text-xs" style={{ color: '#71717a' }}>Auto-join workspace</p>
                  </div>
                </div>
                <button
                  onClick={() => updateFormData('domainAutoJoin', !formData.domainAutoJoin)}
                  className="w-12 h-6 rounded-full relative"
                  style={{ backgroundColor: formData.domainAutoJoin ? '#a78bfa' : '#3f3f46' }}
                >
                  <div className="w-5 h-5 rounded-full bg-white absolute top-0.5 transition-all" style={{ left: formData.domainAutoJoin ? '26px' : '2px' }} />
                </button>
              </div>
              <button onClick={nextStep} className="text-sm block mx-auto" style={{ color: '#71717a' }}>Skip for now →</button>
            </div>
          )}
          
          {/* Phone Step */}
          {currentStep.id === 'phone' && (
            <div className="space-y-6">
              <div className="flex gap-3">
                <button className="px-4 py-4 rounded-md flex items-center gap-2" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.15)' }}>
                  <span>🇺🇸</span>
                  <span style={{ color: '#71717a' }}>▼</span>
                </button>
                <input
                  type="tel"
                  placeholder="(201) 555-0123"
                  value={formData.phone}
                  onChange={(e) => updateFormData('phone', e.target.value)}
                  className="flex-1 px-4 py-4 rounded-md text-white text-sm outline-none"
                  style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.15)' }}
                />
              </div>
              <p className="text-xs" style={{ color: '#71717a' }}>Our team might reach out to help you get started. We won't share your phone number.</p>
              <button onClick={nextStep} className="text-sm block mx-auto" style={{ color: '#71717a' }}>Skip →</button>
            </div>
          )}
          
          {/* Goals Step */}
          {currentStep.id === 'goals' && (
            <div className="space-y-2">
              {['Track billable hours', 'Improve focus', 'Understand time usage', 'Generate reports', 'Manage team workload'].map(goal => (
                <button
                  key={goal}
                  onClick={() => toggleArrayItem('goals', goal)}
                  className="w-full px-4 py-3 rounded-md text-sm text-left flex items-center gap-3"
                  style={{
                    backgroundColor: formData.goals.includes(goal) ? `${tierColor}20` : '#141419',
                    border: formData.goals.includes(goal) ? `2px solid ${tierColor}` : '1px solid rgba(255,255,255,0.1)',
                    color: formData.goals.includes(goal) ? tierColor : '#e4e4e7'
                  }}
                >
                  <span className="w-5 h-5 rounded flex items-center justify-center text-xs" style={{ backgroundColor: formData.goals.includes(goal) ? tierColor : 'rgba(255,255,255,0.1)', color: '#fff' }}>
                    {formData.goals.includes(goal) ? '✓' : ''}
                  </span>
                  {goal}
                </button>
              ))}
            </div>
          )}
          
          {/* Integrations Step */}

              className="w-full py-3 rounded-md text-sm font-medium mt-6 disabled:opacity-50"
              style={{ backgroundColor: '#e4e4e7', color: '#000' }}

              Continue

          {currentStep.id === 'invite' && (
            <button onClick={nextStep} className="w-full py-3 rounded-md text-sm font-medium mt-4" style={{ backgroundColor: '#e4e4e7', color: '#000' }}>
              {formData.teamEmails[0] ? 'Send Invites & Continue' : 'Continue'}

        </div>
      </div>
      
      {/* Footer */}
      <div className="px-6 py-4" style={{ borderTop: '1px solid rgba(255,255,255,0.1)' }}>
        <div className="flex items-center justify-between">
          <button onClick={prevStep} className="px-4 py-2 rounded-md text-sm" style={{ backgroundColor: '#1a1a1a', color: '#e4e4e7', border: '1px solid rgba(255,255,255,0.2)' }}>

            <button onClick={nextStep} className="px-4 py-2 rounded-md text-sm" style={{ backgroundColor: '#1a1a1a', color: '#71717a', border: '1px solid rgba(255,255,255,0.2)' }}>
              Skip ›
            </button>
          )}
        </div>
      </div>
    </div>
  );

          <div>
            <h3 className="text-xl font-semibold text-white mb-4">What to expect</h3>
            <p className="text-sm mb-6" style={{ color: '#71717a' }}>In this 25-minute session, we'll walk through your specific needs.</p>
            <div className="space-y-4">
              {benefits.map((b, i) => (
                <div key={i} className="flex gap-3">
                  <svg className="w-5 h-5 flex-shrink-0 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                  <div>
                    <h4 className="text-sm font-medium text-white">{b.title}</h4>
                    <p className="text-xs" style={{ color: '#71717a' }}>{b.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
          
          <div className="rounded-xl p-6" style={{ backgroundColor: '#fff', color: '#111' }}>
            <h3 className="text-xl font-bold mb-2">Book a call with Macgill!</h3>
            <p className="text-sm mb-4" style={{ color: '#666' }}>👋 Hi, I'm the CEO. Book a time on my calendar.</p>
            
            <div className="rounded-lg border p-4 mb-4" style={{ borderColor: '#e5e5e5' }}>
              <h4 className="font-semibold">Rize Team Demo</h4>
              <p className="text-xs" style={{ color: '#666' }}>25 min • Web conferencing</p>
            </div>
            
            <h4 className="font-semibold text-center mb-3">Select a Day - January 2026</h4>
            <div className="grid grid-cols-7 gap-1 text-center text-xs mb-4">
              {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (
                <div key={i} style={{ color: '#999' }}>{d}</div>
              ))}
              {[...Array(4)].map((_, i) => <div key={`e${i}`} />)}
              {[...Array(31)].map((_, i) => (
                <button
                  key={i}
                  onClick={() => setSelectedDate(i + 1)}
                  className="w-8 h-8 rounded-full mx-auto flex items-center justify-center"
                  style={{ 
                    backgroundColor: selectedDate === i + 1 ? '#a78bfa' : 'transparent',
                    color: selectedDate === i + 1 ? '#fff' : i < 27 ? '#ccc' : '#111'
                  }}
                  disabled={i < 27}
                >
                  {i + 1}
                </button>
              ))}
            </div>
            
            {selectedDate && (
              <div>
                <h4 className="font-semibold text-center mb-3">Select a Time</h4>
                <div className="grid grid-cols-3 gap-2">
                  {times.map(time => (
                    <button
                      key={time}
                      onClick={() => setSelectedTime(time)}
                      className="py-2 px-3 rounded-lg text-sm"
                      style={{ 
                        backgroundColor: selectedTime === time ? '#a78bfa' : '#f5f5f5',
                        color: selectedTime === time ? '#fff' : '#111'
                      }}
                    >
                      {time}
                    </button>
                  ))}
                </div>
                {selectedTime && (
                  <button className="w-full mt-4 py-3 rounded-lg text-sm font-semibold" style={{ backgroundColor: '#a78bfa', color: '#fff' }}>
                    Confirm - Jan {selectedDate}, {selectedTime}
                  </button>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

    // Auto-detect and render the main component
    const AppComponent = typeof App !== 'undefined' ? App :
                         typeof RizePricingOnboarding !== 'undefined' ? RizePricingOnboarding :
                         () => <div>No component found</div>;

    ReactDOM.createRoot(document.getElementById('root')).render(<AppComponent />);
  </script>
</body>
</html>
