<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rize Explore Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #111113;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

// Rize Explore Product - Pre-Signup Interactive Demo
// Pattern inspired by Ramp's explore-product experience

function App() {
  const [view, setView] = useState('explore');
  const [email, setEmail] = useState('jonathan.x.wu@gmail.com');
  const [showEmailCapture, setShowEmailCapture] = useState(false);
  const [selectedFeature, setSelectedFeature] = useState('tracking');

  return (
    <div className="min-h-screen text-white antialiased" style={{ backgroundColor: '#111113' }}>
      {/* Navigation */}
      <nav className="sticky top-0 z-50 border-b px-6 py-4" style={{ backgroundColor: '#111113', borderColor: 'rgba(255,255,255,0.1)' }}>
        <div className="mx-auto max-w-6xl flex items-center justify-between">
          <span className="text-xl tracking-widest font-light">RIZE</span>
          <div className="flex items-center gap-6">
            <button
              onClick={() => setView('explore')}
              className="text-sm"
              style={{ color: view === 'explore' ? '#fff' : '#a1a1aa' }}
            >
              Explore
            </button>
            <button
              onClick={() => setView('demo')}
              className="text-sm"
              style={{ color: view === 'demo' ? '#fff' : '#a1a1aa' }}
            >
              Interactive Demo
            </button>
            <button
              onClick={() => setShowEmailCapture(true)}
              className="px-4 py-2 rounded-md text-sm font-medium"
              style={{ backgroundColor: '#e4e4e7', color: '#000' }}
            >
              Get Started Free
            </button>
          </div>
        </div>
      </nav>

      {view === 'explore' && (
        <ExploreView
          selectedFeature={selectedFeature}
          setSelectedFeature={setSelectedFeature}
          onGetStarted={() => setShowEmailCapture(true)}
        />
      )}

      {view === 'demo' && (
        <InteractiveDemo onGetStarted={() => setShowEmailCapture(true)} />
      )}

      {/* Email Capture Modal */}
      {showEmailCapture && (
        <EmailCaptureModal
          email={email}
          setEmail={setEmail}
          onClose={() => setShowEmailCapture(false)}
        />
      )}
    </div>
  );
}

// ==========================================
// EXPLORE VIEW
// ==========================================
function ExploreView({ selectedFeature, setSelectedFeature, onGetStarted }) {
  const features = [
    {
      id: 'tracking',
      name: 'Automatic Time Tracking',
      tagline: 'Stop starting timers. Start working.',
      description: 'Rize runs quietly in the background, automatically tracking time spent in every app, browser tab, and meeting. No manual timers, no forgotten hours.',
      benefits: ['AI-powered categorization', 'Works across all apps', 'Zero setup required'],
      demo: 'tracking'
    },
    {
      id: 'insights',
      name: 'Productivity Insights',
      tagline: 'Finally understand where your time goes.',
      description: 'See your work patterns visualized. Discover your most productive hours, track focus time vs. distractions, and identify time sinks.',
      benefits: ['Daily & weekly reports', 'Focus score tracking', 'Distraction analysis'],
      demo: 'insights'
    },
    {
      id: 'billing',
      name: 'Billable Hours',
      tagline: 'Never miss a billable minute.',
      description: 'Automatically capture billable time by client and project. Generate professional reports and export data for invoicing in one click.',
      benefits: ['Client & project tracking', 'Automatic categorization', 'One-click invoice export'],
      demo: 'billing'
    },
    {
      id: 'teams',
      name: 'Team Visibility',
      tagline: 'See your whole team\'s workload.',
      description: 'Real-time dashboards show who\'s working on what, project profitability, and team utilization. No more status meetings.',
      benefits: ['Utilization dashboards', 'Profitability reports', 'Automatic team round-ups'],
      demo: 'teams'
    }
  ];

  const currentFeature = features.find(f => f.id === selectedFeature);

  return (
    <div>
      {/* Hero */}
      <section className="px-6 py-16 text-center" style={{ maxWidth: '900px', margin: '0 auto' }}>
        <h1 className="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tight">
          See Rize in Action
        </h1>
        <p className="text-lg mb-8" style={{ color: '#a1a1aa' }}>
          Explore how Rize saves 5+ hours per week on time tracking—before you sign up.
        </p>
        <div className="flex items-center justify-center gap-4">
          <button
            onClick={onGetStarted}
            className="px-6 py-3 rounded-md text-sm font-medium"
            style={{ backgroundColor: '#e4e4e7', color: '#000' }}
          >
            Start Free Trial
          </button>
          <a
            href="#features"
            className="px-6 py-3 rounded-md text-sm font-medium"
            style={{ color: '#a1a1aa' }}
          >
            Explore Features ↓
          </a>
        </div>
      </section>

      {/* Feature Tabs */}
      <section id="features" className="px-6 py-12" style={{ backgroundColor: '#0d0d0f' }}>
        <div className="mx-auto" style={{ maxWidth: '1100px' }}>
          {/* Tab Navigation */}
          <div className="flex gap-2 mb-8 overflow-x-auto pb-2">
            {features.map(feature => (
              <button
                key={feature.id}
                onClick={() => setSelectedFeature(feature.id)}
                className="px-5 py-3 rounded-lg text-sm font-medium whitespace-nowrap transition-all"
                style={{
                  backgroundColor: selectedFeature === feature.id ? '#a78bfa20' : '#141419',
                  border: selectedFeature === feature.id ? '1px solid #a78bfa40' : '1px solid rgba(255,255,255,0.1)',
                  color: selectedFeature === feature.id ? '#a78bfa' : '#a1a1aa'
                }}
              >
                {feature.name}
              </button>
            ))}
          </div>

          {/* Feature Content */}
          <div className="grid md:grid-cols-2 gap-8 items-center">
            {/* Left: Description */}
            <div>
              <p className="text-sm mb-2" style={{ color: '#a78bfa' }}>{currentFeature.tagline}</p>
              <h2 className="text-2xl font-semibold text-white mb-4">{currentFeature.name}</h2>
              <p className="mb-6" style={{ color: '#a1a1aa' }}>{currentFeature.description}</p>
              <ul className="space-y-3 mb-8">
                {currentFeature.benefits.map((benefit, i) => (
                  <li key={i} className="flex items-center gap-3">
                    <svg className="w-5 h-5 text-purple-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    <span className="text-sm text-white">{benefit}</span>
                  </li>
                ))}
              </ul>
              <button
                onClick={onGetStarted}
                className="px-5 py-2.5 rounded-md text-sm font-medium"
                style={{ backgroundColor: '#a78bfa', color: '#fff' }}
              >
                Try {currentFeature.name} Free →
              </button>
            </div>

            {/* Right: Demo Preview */}
            <div className="rounded-xl overflow-hidden" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}>
              <FeatureDemo feature={currentFeature.id} />
            </div>
          </div>
        </div>
      </section>

      {/* Stats Bar */}
      <section className="px-6 py-12">
        <div className="mx-auto grid grid-cols-4 gap-4" style={{ maxWidth: '900px' }}>
          {[
            { stat: '100K+', label: 'Users' },
            { stat: '5+ hrs', label: 'Saved weekly' },
            { stat: '98%', label: 'Accuracy' },
            { stat: '4.8/5', label: 'Rating' }
          ].map((item, i) => (
            <div key={i} className="text-center p-4 rounded-xl" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}>
              <div className="text-2xl font-bold mb-1" style={{ color: '#a78bfa' }}>{item.stat}</div>
              <div className="text-xs" style={{ color: '#71717a' }}>{item.label}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Email CTA */}
      <section className="px-6 py-16" style={{ backgroundColor: '#0d0d0f' }}>
        <div className="mx-auto text-center" style={{ maxWidth: '500px' }}>
          <h2 className="text-2xl font-semibold text-white mb-3">Ready to see where your time goes?</h2>
          <p className="text-sm mb-6" style={{ color: '#71717a' }}>Start your free 14-day trial. No credit card required to explore.</p>
          <button
            onClick={onGetStarted}
            className="px-8 py-3 rounded-md text-sm font-medium"
            style={{ backgroundColor: '#e4e4e7', color: '#000' }}
          >
            Get Started Free
          </button>
        </div>
      </section>
    </div>
  );
}

          </div>
          <div className="p-3 rounded-lg" style={{ backgroundColor: '#1a1a1f' }}>

// ==========================================
// INTERACTIVE DEMO
// ==========================================
function InteractiveDemo({ onGetStarted }) {
  const [demoStep, setDemoStep] = useState(0);

  const steps = [
    {
      title: 'Install Rize',
      description: 'Download the desktop app. It takes 30 seconds.',
      action: 'Download for Mac'
    },
    {
      title: 'Work normally',
      description: 'Rize runs in the background, tracking time automatically.',
      action: 'See it tracking'
    },
    {
      title: 'Review your day',
      description: 'At end of day, see exactly where your time went.',
      action: 'View dashboard'
    },
    {
      title: 'Get insights',
      description: 'Weekly reports show productivity trends and improvements.',
      action: 'Start free trial'
    }
  ];

  return (
    <div className="px-6 py-16">
      <div className="mx-auto" style={{ maxWidth: '800px' }}>
        <div className="text-center mb-12">
          <h1 className="text-3xl font-bold text-white mb-3">How Rize Works</h1>
          <p style={{ color: '#a1a1aa' }}>See the complete workflow in 4 simple steps</p>
        </div>

        {/* Progress */}
        <div className="flex items-center justify-center gap-2 mb-12">
          {steps.map((_, i) => (
            <button
              key={i}
              onClick={() => setDemoStep(i)}
              className="h-2 rounded-full transition-all"
              style={{
                width: demoStep === i ? '32px' : '8px',
                backgroundColor: demoStep >= i ? '#a78bfa' : '#3f3f46'
              }}
            />
          ))}
        </div>

        {/* Step Content */}
        <div className="grid md:grid-cols-2 gap-8 items-center">
          <div>
            <span className="text-xs px-2 py-1 rounded mb-4 inline-block" style={{ backgroundColor: '#a78bfa20', color: '#a78bfa' }}>
              Step {demoStep + 1} of {steps.length}
            </span>
            <h2 className="text-2xl font-semibold text-white mb-3">{steps[demoStep].title}</h2>
            <p className="mb-6" style={{ color: '#a1a1aa' }}>{steps[demoStep].description}</p>
            <div className="flex gap-3">
              {demoStep < steps.length - 1 ? (
                <button
                  onClick={() => setDemoStep(demoStep + 1)}
                  className="px-5 py-2.5 rounded-md text-sm font-medium"
                  style={{ backgroundColor: '#a78bfa', color: '#fff' }}
                >
                  {steps[demoStep].action} →
                </button>
              ) : (
                <button
                  onClick={onGetStarted}
                  className="px-5 py-2.5 rounded-md text-sm font-medium"
                  style={{ backgroundColor: '#e4e4e7', color: '#000' }}
                >
                  Start Free Trial →
                </button>
              )}
              {demoStep > 0 && (
                <button
                  onClick={() => setDemoStep(demoStep - 1)}
                  className="px-5 py-2.5 rounded-md text-sm font-medium"
                  style={{ backgroundColor: '#1a1a1a', color: '#fff', border: '1px solid rgba(255,255,255,0.2)' }}
                >
                  ← Back
                </button>
              )}
            </div>
          </div>

          {/* Demo Visual */}
          <div className="rounded-xl p-6" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}>
            <DemoStepVisual step={demoStep} />
          </div>
        </div>
      </div>
    </div>
  );
}

function DemoStepVisual({ step }) {
  if (step === 0) {
    return (
      <div className="text-center py-8">
        <div className="w-20 h-20 mx-auto rounded-xl flex items-center justify-center mb-4" style={{ backgroundColor: '#1a1a1f' }}>
          <svg className="w-10 h-10" fill="currentColor" viewBox="0 0 24 24" style={{ color: '#a78bfa' }}>
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
        </div>
        <p className="text-sm text-white mb-2">Download for Mac or Windows</p>
        <p className="text-xs" style={{ color: '#71717a' }}>2MB • Installs in 30 seconds</p>
      </div>
    );
  }

  if (step === 1) {
    return (
      <div className="space-y-2">
        <div className="flex items-center gap-2 mb-4">
          <div className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: '#22c55e' }} />
          <span className="text-xs" style={{ color: '#22c55e' }}>Tracking active</span>
        </div>
        {[
          { app: 'VS Code', time: '47m', active: true },
          { app: 'Chrome - Figma', time: '12m', active: false },
          { app: 'Slack', time: '5m', active: false }
        ].map((item, i) => (
          <div
            key={i}
            className="flex items-center justify-between p-3 rounded-lg"
            style={{ backgroundColor: item.active ? '#a78bfa15' : '#1a1a1f', border: item.active ? '1px solid #a78bfa40' : 'none' }}
          >
            <span className="text-sm text-white">{item.app}</span>
            <span className="text-sm" style={{ color: item.active ? '#a78bfa' : '#71717a' }}>{item.time}</span>
          </div>
        ))}
      </div>
    );
  }

  if (step === 2) {
    return (
      <div>
        <div className="flex items-center justify-between mb-4">
          <span className="text-sm text-white">Today's Summary</span>
          <span className="text-xs" style={{ color: '#71717a' }}>Jan 29</span>
        </div>
        <div className="flex gap-2 mb-4">
          {['Deep Work', 'Meetings', 'Email', 'Other'].map((cat, i) => (
            <div
              key={i}
              className="h-3 rounded"
              style={{
                flex: [4, 2, 1, 1][i],
                backgroundColor: ['#a78bfa', '#60a5fa', '#fb923c', '#3f3f46'][i]
              }}
            />
          ))}
        </div>
        <div className="grid grid-cols-2 gap-2">
          {[
            { label: 'Total', value: '7h 24m' },
            { label: 'Focus', value: '5h 12m' },
            { label: 'Meetings', value: '1h 30m' },
            { label: 'Breaks', value: '42m' }
          ].map((item, i) => (
            <div key={i} className="p-2 rounded" style={{ backgroundColor: '#1a1a1f' }}>
              <p className="text-xs" style={{ color: '#71717a' }}>{item.label}</p>
              <p className="text-sm font-medium text-white">{item.value}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if (step === 3) {
    return (
      <div className="text-center py-4">
        <div className="text-4xl font-bold mb-2" style={{ color: '#22c55e' }}>+23%</div>
        <p className="text-sm text-white mb-1">Focus time improvement</p>
        <p className="text-xs mb-6" style={{ color: '#71717a' }}>After 4 weeks with Rize</p>
        <div className="flex justify-center gap-4">
          {[
            { label: 'Before', value: '3.2h/day' },
            { label: 'After', value: '4.1h/day' }
          ].map((item, i) => (
            <div key={i} className="p-3 rounded-lg" style={{ backgroundColor: '#1a1a1f' }}>
              <p className="text-xs" style={{ color: '#71717a' }}>{item.label}</p>
              <p className="text-sm font-medium text-white">{item.value}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return null;
}
