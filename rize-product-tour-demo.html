<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rize Product Tour - Interactive Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #111113; font-family: ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .pulse-ring { animation: pulse-ring 2s ease-out infinite; }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .tooltip-arrow {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #1e1e21;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentStep, setCurrentStep] = useState(0);
      const [showWelcome, setShowWelcome] = useState(true);
      const [selectedPersona, setSelectedPersona] = useState('productivity');
      const [completedSteps, setCompletedSteps] = useState(['overview']);
      const [highlightElement, setHighlightElement] = useState(null);

      const personas = [
        { id: 'productivity', label: 'Productivity', icon: '⚡' },
        { id: 'freelancer', label: 'IC/Freelancer', icon: '💼' },
        { id: 'manager', label: 'Manager', icon: '👥' },
        { id: 'founder', label: 'Owner/Founder', icon: '🚀' }
      ];

      const tourSteps = [
        {
          id: 'overview',
          title: 'Rize Overview',
          description: 'Welcome to your productivity dashboard',
          highlight: 'dashboard',
          position: { top: '120px', left: '340px' },
          arrow: 'left'
        },
        {
          id: 'focus',
          title: 'Focus Sessions',
          description: 'Block distractions and enter deep work mode. Click the timer to start a focus session.',
          highlight: 'timer',
          position: { top: '80px', left: '120px' },
          arrow: 'top'
        },
        {
          id: 'timeline',
          title: 'Activity Timeline',
          description: 'See exactly how you spent your day with automatic app tracking.',
          highlight: 'timeline',
          position: { top: '280px', left: '500px' },
          arrow: 'left'
        },
        {
          id: 'stats',
          title: 'Daily Stats',
          description: 'Track your total time, focus hours, and productivity score.',
          highlight: 'stats',
          position: { top: '140px', left: '600px' },
          arrow: 'top'
        },
        {
          id: 'getstarted',
          title: 'Get Started',
          description: 'Ready to boost your productivity? Start your free trial now!',
          highlight: 'cta',
          position: { top: '20px', right: '200px' },
          arrow: 'top'
        }
      ];

      const handleNextStep = () => {
        if (currentStep < tourSteps.length - 1) {
          const nextStep = tourSteps[currentStep + 1];
          if (!completedSteps.includes(nextStep.id)) {
            setCompletedSteps([...completedSteps, nextStep.id]);
          }
          setCurrentStep(currentStep + 1);
          setHighlightElement(nextStep.highlight);
        }
      };

      const handlePrevStep = () => {
        if (currentStep > 0) {
          setCurrentStep(currentStep - 1);
          setHighlightElement(tourSteps[currentStep - 1].highlight);
        }
      };

      const handleStartTour = () => {
        setShowWelcome(false);
        setHighlightElement('dashboard');
      };

      const tourProgress = (completedSteps.length / tourSteps.length) * 100;
      const currentTourStep = tourSteps[currentStep];

      return (
        <div className="min-h-screen relative" style={{ backgroundColor: '#111113' }}>
          {/* Top CTA Bar */}
          <div
            className="sticky top-0 z-40 px-4 py-2.5 flex items-center justify-center gap-4"
            style={{
              backgroundColor: '#a78bfa',
              boxShadow: highlightElement === 'cta' ? '0 0 0 4px rgba(167,139,250,0.4)' : 'none'
            }}
          >
            <span className="text-sm font-medium text-white">Ready to start tracking your time?</span>
            <button className="px-4 py-1.5 rounded-md text-sm font-medium" style={{ backgroundColor: '#fff', color: '#7c3aed' }}>
              Get Started Free
            </button>
          </div>

          {/* Main Layout */}
          <div className="flex">
            {/* Sidebar */}
            <div className="w-64 min-h-screen flex flex-col" style={{ backgroundColor: '#0d0d0f', borderRight: '1px solid rgba(255,255,255,0.1)' }}>
              <div className="p-4 flex items-center gap-2">
                <span className="text-lg tracking-widest font-light text-white">RIZE</span>
                <span className="text-xs px-1.5 py-0.5 rounded" style={{ backgroundColor: 'rgba(167,139,250,0.2)', color: '#a78bfa' }}>DEMO</span>
              </div>

              <nav className="flex-1 px-2 py-4">
                <div className="space-y-1">
                  {[
                    { label: 'Home', active: true },
                    { label: 'Timer', highlight: 'timer' },
                    { label: 'Activity' },
                    { label: 'Workspaces' },
                    { label: 'Profitability' },
                    { label: 'Billing' }
                  ].map((item, i) => (
                    <button
                      key={i}
                      className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors relative"
                      style={{
                        backgroundColor: item.active ? 'rgba(255,255,255,0.1)' : 'transparent',
                        color: item.active ? '#fff' : '#71717a',
                        boxShadow: highlightElement === item.highlight ? '0 0 0 2px rgba(167,139,250,0.6)' : 'none'
                      }}
                    >
                      {highlightElement === item.highlight && (
                        <div className="absolute -left-1 -top-1 w-2 h-2 rounded-full bg-purple-400">
                          <div className="absolute inset-0 rounded-full bg-purple-400 pulse-ring" />
                        </div>
                      )}
                      <span>{item.label}</span>
                    </button>
                  ))}
                </div>
              </nav>

              {/* Account */}
              <div className="p-3" style={{ borderTop: '1px solid rgba(255,255,255,0.1)' }}>
                <div className="flex items-center gap-3 px-3 py-2">
                  <img src="https://i.imgur.com/JqYWQxO.jpg" alt="Johnny Wu" className="w-8 h-8 rounded-full object-cover" />
                  <div className="flex-1">
                    <p className="text-sm text-white">Johnny Wu</p>
                    <p className="text-xs" style={{ color: '#71717a' }}>Product Team</p>
                  </div>
                </div>
              </div>
            </div>

            {/* Main Content */}
            <div className="flex-1 relative">
              {/* Header */}
              <div className="sticky top-10 z-30 px-6 py-4 flex items-center justify-between" style={{ backgroundColor: '#111113', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                <div className="flex items-center gap-4">
                  <button className="p-2 rounded-lg" style={{ backgroundColor: 'rgba(255,255,255,0.05)' }}>
                    <span style={{ color: '#71717a' }}>←</span>
                  </button>
                  <h1 className="text-lg font-semibold text-white">Wednesday, January 29</h1>
                  <button className="p-2 rounded-lg" style={{ backgroundColor: 'rgba(255,255,255,0.05)' }}>
                    <span style={{ color: '#71717a' }}>→</span>
                  </button>
                </div>
              </div>

              {/* Dashboard Content */}
              <div className="p-6" style={{ filter: showWelcome ? 'blur(4px)' : 'none', transition: 'filter 0.3s' }}>
                {/* Stats Row */}
                <div
                  className="grid grid-cols-4 gap-4 mb-6 relative"
                  style={{ boxShadow: highlightElement === 'stats' ? '0 0 0 3px rgba(167,139,250,0.4)' : 'none', borderRadius: '12px' }}
                >
                  {highlightElement === 'stats' && (
                    <div className="absolute -right-1 -top-1 w-3 h-3 rounded-full bg-purple-400 z-10">
                      <div className="absolute inset-0 rounded-full bg-purple-400 pulse-ring" />
                    </div>
                  )}
                  {[
                    { label: 'Total Time', value: '6h 42m', color: '#a78bfa' },
                    { label: 'Focus Time', value: '4h 15m', color: '#60a5fa' },
                    { label: 'Productive', value: '89%', color: '#34d399' },
                    { label: 'Meetings', value: '1h 30m', color: '#f97316' }
                  ].map((stat, i) => (
                    <div key={i} className="p-4 rounded-xl" style={{ backgroundColor: '#141419', border: '1px solid rgba(255,255,255,0.1)' }}>
                      <p className="text-xs mb-1" style={{ color: '#71717a' }}>{stat.label}</p>
                      <p className="text-2xl font-semibold" style={{ color: stat.color }}>{stat.value}</p>
                    </div>
                  ))}
                </div>

                {/* Timeline */}
                <div
                  className="rounded-xl p-6 relative"
                  style={{
                    backgroundColor: '#141419',
                    border: '1px solid rgba(255,255,255,0.1)',
                    boxShadow: highlightElement === 'timeline' ? '0 0 0 3px rgba(167,139,250,0.4)' : 'none'
                  }}
                >
                  {highlightElement === 'timeline' && (
                    <div className="absolute -right-1 -top-1 w-3 h-3 rounded-full bg-purple-400 z-10">
                      <div className="absolute inset-0 rounded-full bg-purple-400 pulse-ring" />
                    </div>
                  )}
                  <h3 className="text-sm font-medium text-white mb-4">Today's Timeline</h3>
                  <div className="space-y-3">
                    {[
                      { time: '9:00 AM', app: 'VS Code', duration: '2h 15m', color: '#007ACC', category: 'Development' },
                      { time: '11:15 AM', app: 'Slack', duration: '45m', color: '#4A154B', category: 'Communication' },
                      { time: '12:00 PM', app: 'Lunch Break', duration: '1h', color: '#71717a', category: 'Break' },
                      { time: '1:00 PM', app: 'Figma', duration: '1h 30m', color: '#F24E1E', category: 'Design' },
                      { time: '2:30 PM', app: 'Google Meet', duration: '1h', color: '#00897B', category: 'Meeting' }
                    ].map((entry, i) => (
                      <div key={i} className="flex items-center gap-4">
                        <span className="text-xs w-16" style={{ color: '#71717a' }}>{entry.time}</span>
                        <div className="flex-1 flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs font-bold" style={{ backgroundColor: entry.color }}>
                            {entry.app[0]}
                          </div>
                          <div className="flex-1">
                            <p className="text-sm text-white">{entry.app}</p>
                            <p className="text-xs" style={{ color: '#71717a' }}>{entry.category}</p>
                          </div>
                          <span className="text-sm" style={{ color: '#a1a1aa' }}>{entry.duration}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Tour Tooltip */}
              {!showWelcome && (
                <div
                  className="fixed z-50 w-72 rounded-lg overflow-hidden"
                  style={{
                    backgroundColor: '#1e1e21',
                    boxShadow: '0 25px 50px -12px rgba(0,0,0,0.5)',
                    ...currentTourStep.position
                  }}
                >
                  {/* Arrow */}
                  {currentTourStep.arrow === 'left' && (
                    <div className="tooltip-arrow" style={{ left: '-6px', top: '20px' }} />
                  )}
                  {currentTourStep.arrow === 'top' && (
                    <div className="tooltip-arrow" style={{ top: '-6px', left: '24px' }} />
                  )}

                  {/* Content */}
                  <div className="p-4">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xs px-2 py-0.5 rounded" style={{ backgroundColor: 'rgba(167,139,250,0.2)', color: '#a78bfa' }}>
                        Step {currentStep + 1} of {tourSteps.length}
                      </span>
                    </div>
                    <h4 className="text-sm font-semibold text-white mb-1">{currentTourStep.title}</h4>
                    <p className="text-xs mb-4" style={{ color: '#71717a' }}>{currentTourStep.description}</p>

                    {/* Navigation */}
                    <div className="flex items-center justify-between">
                      <button
                        onClick={handlePrevStep}
                        disabled={currentStep === 0}
                        className="px-3 py-1.5 rounded text-xs font-medium transition-all"
                        style={{
                          backgroundColor: currentStep === 0 ? 'transparent' : 'rgba(255,255,255,0.08)',
                          color: currentStep === 0 ? '#52525b' : '#e4e4e7'
                        }}
                      >
                        Back
                      </button>
                      <div className="flex gap-1">
                        {tourSteps.map((_, i) => (
                          <div
                            key={i}
                            className="w-1.5 h-1.5 rounded-full transition-all"
                            style={{ backgroundColor: i <= currentStep ? '#a78bfa' : 'rgba(255,255,255,0.2)' }}
                          />
                        ))}
                      </div>
                      <button
                        onClick={handleNextStep}
                        className="px-3 py-1.5 rounded text-xs font-medium transition-all"
                        style={{ backgroundColor: 'rgba(167,139,250,0.2)', color: '#a78bfa' }}
                      >
                        {currentStep === tourSteps.length - 1 ? 'Finish' : 'Next'}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Product Tour Panel */}
              {!showWelcome && (
                <div
                  className="fixed right-6 top-24 w-72 rounded-lg overflow-hidden z-40"
                  style={{ backgroundColor: '#1e1e21', boxShadow: '0 25px 50px -12px rgba(0,0,0,0.5)' }}
                >
                  <div className="px-4 pt-4 pb-3 flex items-center justify-between">
                    <h3 className="text-sm font-semibold text-white">Product Tour</h3>
                    <span className="text-xs font-medium" style={{ color: '#a78bfa' }}>{Math.round(tourProgress)}%</span>
                  </div>

                  {/* Progress */}
                  <div className="px-4 pb-3">
                    <div className="h-1 rounded-full" style={{ backgroundColor: 'rgba(255,255,255,0.08)' }}>
                      <div
                        className="h-full rounded-full transition-all duration-500"
                        style={{ width: `${tourProgress}%`, backgroundColor: '#a78bfa' }}
                      />
                    </div>
                  </div>

                  {/* Steps */}
                  <div className="px-2 pb-2 max-h-48 overflow-y-auto">
                    {tourSteps.map((step, i) => {
                      const isCompleted = completedSteps.includes(step.id);
                      const isCurrent = i === currentStep;
                      return (
                        <button
                          key={step.id}
                          onClick={() => {
                            setCurrentStep(i);
                            setHighlightElement(step.highlight);
                            if (!completedSteps.includes(step.id)) {
                              setCompletedSteps([...completedSteps, step.id]);
                            }
                          }}
                          className="w-full flex items-center gap-2.5 px-2 py-1.5 rounded text-left transition-all"
                          style={{
                            backgroundColor: isCurrent ? 'rgba(167,139,250,0.12)' : 'transparent'
                          }}
                        >
                          <div
                            className="w-4 h-4 rounded-full flex items-center justify-center flex-shrink-0"
                            style={{
                              backgroundColor: isCompleted ? '#a78bfa' : 'transparent',
                              border: isCompleted ? 'none' : '2px solid rgba(255,255,255,0.15)'
                            }}
                          >
                            {isCompleted && (
                              <svg className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                              </svg>
                            )}
                          </div>
                          <span className="text-xs font-medium truncate" style={{ color: isCurrent ? '#fff' : '#a1a1aa' }}>
                            {step.title}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Welcome Modal */}
          {showWelcome && (
            <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ backgroundColor: 'rgba(0,0,0,0.85)' }}>
              <div className="w-full max-w-md rounded-lg overflow-hidden" style={{ backgroundColor: '#1e1e21', boxShadow: '0 25px 50px -12px rgba(0,0,0,0.5)' }}>
                <h2 className="px-6 pt-6 pb-4 text-lg font-semibold text-white">Welcome to Rize</h2>
                <div className="px-6 pb-4">
                  <p className="text-sm mb-4" style={{ color: '#71717a' }}>Select your role to personalize your experience</p>
                  <div className="space-y-1">
                    {personas.map(persona => (
                      <button
                        key={persona.id}
                        onClick={() => setSelectedPersona(persona.id)}
                        className="w-full flex items-center gap-3 px-3 py-2.5 rounded text-left transition-all"
                        style={{ backgroundColor: selectedPersona === persona.id ? 'rgba(167,139,250,0.12)' : 'transparent' }}
                      >
                        <div className="w-7 h-7 rounded flex items-center justify-center text-sm flex-shrink-0" style={{ backgroundColor: 'rgba(255,255,255,0.08)' }}>
                          {persona.icon}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium" style={{ color: '#e4e4e7' }}>{persona.label}</p>
                        </div>
                        <div
                          className="w-4 h-4 rounded-full flex items-center justify-center flex-shrink-0"
                          style={{
                            backgroundColor: selectedPersona === persona.id ? '#a78bfa' : 'transparent',
                            border: selectedPersona === persona.id ? 'none' : '2px solid rgba(255,255,255,0.2)'
                          }}
                        >
                          {selectedPersona === persona.id && (
                            <svg className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                          )}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
                <div className="px-6 py-4" style={{ backgroundColor: 'rgba(255,255,255,0.02)' }}>
                  <button
                    onClick={handleStartTour}
                    className="px-4 py-2 rounded text-sm font-medium transition-all"
                    style={{ backgroundColor: 'rgba(255,255,255,0.1)', color: '#e4e4e7' }}
                  >
                    Start Tour
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
